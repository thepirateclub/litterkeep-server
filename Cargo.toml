[package]
name = "litterkeep-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A small self-hosted mail server implemented without a mail engine or async runtime."
license = "MIT"
readme = "README.md"
repository = "https://github.com/katagarov/litterkeep-server"
homepage = "https://github.com/katagarov/litterkeep-server"
keywords = ["smtp", "imap", "pop3", "managesieve", "mail-server"]
categories = ["email", "network-programming"]
# Это сервер для локального профиля, а не библиотека для публикации.
publish = false
exclude = [
    "GOAL.md",
    "docs/",
    "tests/",
    "docker/",
    "tools/",
]

[[bin]]
name = "litterkeep-server"
path = "src/main.rs"

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash", "getrandom"] }
rustls = { version = "0.23.45", default-features = false, features = ["std", "ring", "tls12"] }

[dev-dependencies]
# Используется только examples/make_test_pki.rs, не попадает в серверный binary.
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
