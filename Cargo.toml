[package]
name = "litterkeep-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A small self-hosted mail server implemented without a mail engine or async runtime."
license = "UNLICENSED"

[[bin]]
name = "litterkeep-server"
path = "src/main.rs"

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash", "getrandom"] }
rustls = { version = "0.23.45", default-features = false, features = ["std", "ring", "tls12"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
